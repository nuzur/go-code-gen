name: Go CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true

      - name: Install dependencies
        run: go mod download

      # Generation invokes protoc whenever the proto surface is enabled, and the
      # proto tests (TestProtoImportsFollowRenderedTypes, the fieldtypes matrix's
      # proto arm) skip without it — which kept CI green while asserting nothing
      # about protos, until a test that could not skip made it red instead.
      # Installing it keeps the proto arm real in CI.
      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler

      - name: Run Tests
        run: go test -v ./...
